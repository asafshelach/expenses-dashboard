<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>דשבורד הוצאות משפחתי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  --bg: #f3efe6;
  --card: #fffcf7;
  --ink: #1c2428;
  --muted: #5c6b73;
  --line: #d8d2c4;
  --teal: #0f6e6a;
  --teal-soft: #d7ecea;
  --teal-mid: #1a9490;
  --coral: #c45c48;
  --coral-soft: #f8e4df;
  --good: #2f7d4a;
  --good-soft: #e2f0e6;
  --warn: #8a6000;
  --warn-soft: #fff3cc;
  --shadow: 0 4px 18px rgba(28,36,40,.07);
  --shadow-lg: 0 10px 40px rgba(28,36,40,.13);
  --radius: 16px;
  --radius-sm: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Rubik", system-ui, sans-serif;
  color: var(--ink);
  background:
    radial-gradient(1100px 480px at 100% -8%, #dceceb 0%, transparent 55%),
    radial-gradient(800px 380px at 0% 0%, #f6e8dc 0%, transparent 50%),
    var(--bg);
  min-height: 100vh;
}
header {
  background: var(--teal);
  color: #fff;
  padding: 1rem 1.25rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .75rem;
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 50;
  box-shadow: 0 2px 12px rgba(0,0,0,.18);
}
.header-left h1 { font-size: 1.15rem; font-weight: 700; }
.header-left .sub { font-size: .78rem; opacity: .72; margin-top: .1rem; }
.month-nav { display: flex; align-items: center; gap: .4rem; }
.month-nav button {
  background: rgba(255,255,255,.18);
  border: 1px solid rgba(255,255,255,.28);
  color: #fff;
  border-radius: 8px;
  width: 32px; height: 32px;
  font-size: 1.1rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s;
  flex-shrink: 0;
}
.month-nav button:hover { background: rgba(255,255,255,.3); }
.month-nav select {
  background: rgba(255,255,255,.15);
  border: 1px solid rgba(255,255,255,.28);
  color: #fff;
  border-radius: 8px;
  padding: .35rem .7rem;
  font-family: "Rubik", sans-serif;
  font-size: .88rem;
  font-weight: 500;
  cursor: pointer;
  outline: none;
  -webkit-appearance: none;
  appearance: none;
  max-width: 160px;
}
.month-nav select option { background: #0f5e5a; color: #fff; }
.tabs {
  background: var(--card);
  border-bottom: 1px solid var(--line);
  display: flex;
  overflox-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  position: sticky;
  top: 57px;
  z-index: 40;
}
.tabs::-webkit-scrollbar { display: none; }
.tab-btn {
  flex-shrink: 0;
  padding: .75rem 1.25rem;
  font-family: "Rubik", sans-serif;
  font-size: .88rem;
  font-weight: 500;
  color: var(--muted);
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  transition: color .15s, border-color .15s;
  white-space: nowrap;
}
.tab-btn.active { color: var(--teal); border-bottom-color: var(--teal); }
.tab-btn:hover:not(.active) { color: var(--ink); }
.wrap { max-width: 960px; margin: 0 auto; padding: 1.25rem 1rem 4rem; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }
section { margin-bottom: 1.25rem; }
#loading-overlay { text-align: center; padding: 4rem 1rem; }
.spinner {
  width: 36px; height: 36px;
  border: 3px solid var(--line);
  border-top-color: var(--teal);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  margin: 0 auto .9rem;
}
@keyframes spin { to { transform: rotate(360deg); } }
#error-box {
  display: none;
  background: var(--coral-soft);
  border: 1px solid #f5c0b0;
  border-radius: var(--radius-sm);
  padding: 1rem 1.25rem;
  color: var(--coral);
  font-size: .9rem;
  margin-bottom: 1.25rem;
}
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 1.1rem 1.2rem;
  box-shadow: var(--shadow);
}
.card.hero {
  background: linear-gradient(145deg, #0f6e6a 0%, #194f5c 100%);
  color: #f7fffe;
  border: 0;
}
.card-label { display: block; font-size: .74rem; font-weight: 500; color: var(--muted); margin-bottom: .2rem; letter-spacing: .02em; text-transform: uppercase; }
.card.hero .card-label { color: rgba(255,255,255,.72); }
.card-value { font-size: clamp(1.3rem, 4vw, 1.75rem); font-weight: 700; letter-spacing: -.02em; }
.card.hero .card-value { color: #fff; }
.card-note { font-size: .78rem; color: var(--muted); margin-top: .3rem; line-height: 1.4; }
.card.hero .card-note { color: rgba(255,255,255,.75); }
.pill {
  display: inline-flex; align-items: center; gap: .3rem;
  padding: .18rem .6rem; border-radius: 999px;
  font-size: .73rem; font-weight: 600; margin-top: .45rem;
}
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.bad { background: var(--coral-soft); color: var(--coral); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.neutral { background: var(--teal-soft); color: var(--teal); }
.card.hero .pill.good { background: rgba(255,255,255,.18); color: #e8fff4; }
.card.hero .pill.bad { background: rgba(255,200,180,.25); color: #ffe8e0; }
.grid { display: grid; gap: .85rem; }
.grid-2 { grid-template-columns: 1fr 1fr; }
.grid-3 { grid-template-columns: repeat(3,1fr); }
@media (max-width:720px) {
  .grid-3 { grid-template-columns: 1fr 1fr; }
  .stack-mobile { grid-template-columns: 1fr !important; }
}
@media (max-width:480px) {
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
}
.progress-track {
  background: rgba(255,255,255,.2);
  border-radius: 999px;
  height: 9px;
  overflow: hidden;
  margin-top: .75rem;
}
.progress-track.light { background: #ece7dc; }
.progress-fill {
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, #7fd4c8, rgba(255,255,255,.6));
  transition: width .5s ease;
}
.progress-track.light .progress-fill { background: linear-gradient(90deg, var(--teal), #49a6a1); }
.progress-track.light .progress-fill.warn { background: linear-gradient(90deg, #d4a800, #f0c830); }
.progress-track.light .progress-fill.over { background: linear-gradient(90deg, var(--coral), #e87060); }
.section-head {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: .5rem; margin-bottom: .75rem; flex-wrap: wrap;
}
.section-head h2 { font-size: 1rem; font-weight: 700; color: var(--teal); }
.section-head .aside { font-size: .76rem; color: var(--muted); }
.chart-wrap { position: relative; }
.chart-wrap.h160 { height: 160px; }
.chart-wrap.h240 { height: 240px; }
.chart-wrap.h280 { height: 280px; }
.data-table { width: 100%; border-collapse: collapse; font-size: .87rem; }
.data-table th {
  text-align: right; padding: .45rem .35rem; border-bottom: 2px solid var(--line);
  font-size: .72rem; font-weight: 600; color: var(--muted); white-space: nowrap;
}
.data-table td { padding: .5rem .35rem; border-bottom: 1px solid #ede9e0; vertical-align: middle; }
.data-table tr:last-child td { border-bottom: 0; }
.data-table tbody tr.clickable { cursor: pointer; transition: background .1s; }
.data-table tbody tr.clickable:hover td { background: var(--teal-soft); }
.ibar { height: 5px; border-radius: 999px; background: #ece7dc; overflow: hidden; margin-top: .28rem; }
.ibar-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--teal), #49a6a1); }
.user-row { display: flex; align-items: center; gap: .6rem; margin-bottom: .55rem; }
.user-row:last-child { margin-bottom: 0; }
.user-name { font-size: .85rem; font-weight: 500; min-width: 55px; }
.user-bar-wrap { flex: 1; background: #ece7dc; border-radius: 4px; height: 7px; overflow: hidden; }
.user-bar-fill { height: 100%; border-radius: inherit; }
.u-asaf { background: var(--teal); }
.u-karina { background: #c45c48; }
.u-joint  { background: #8b6f47; }
.user-amount { font-size: .83rem; color: var(--muted); direction: ltr; min-width: 90px; text-align: left; font-weight: 500; }
.insights-card {
  background: linear-gradient(135deg, #fffdf8 0%, #eef6f5 100%);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 1.1rem 1.2rem;
  box-shadow: var(--shadow);
}
.insights-card h3 { font-size: .95rem; font-weight: 600; color: var(--teal); margin-bottom: .5rem; }
.insights-card ul { padding-right: 1.1rem; }
.insights-card li { font-size: .87rem; line-height: 1.5; margin-bottom: .35rem; color: #1a3535; }
.filter-row { display: flex; gap: .6rem; flex-wrap: wrap; margin-bottom: .85rem; align-items: center; }
.filter-row input, .filter-row select {
  font-family: "Rubik", sans-serif;
  font-size: .85rem;
  padding: .45rem .75rem;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--card);
  color: var(--ink);
  outline: none;
  min-width: 0;
  flex: 1 1 140px;
}
.filter-row input:focus, .filter-row select:focus { border-color: var(--teal); }
.file-drop {
  border: 2px dashed var(--line);
  border-radius: var(--radius-sm);
  padding: 2rem 1rem;
  text-align: center;
  cursor: pointer;
  transition: border-color .2s, background .2s;
  display: block;
}
.file-drop:hover, .file-drop.drag { border-color: var(--teal); background: var(--teal-soft); }
.file-drop input[type=file] { display: none; }
.file-drop .drop-icon { font-size: 2rem; margin-bottom: .4rem; }
.file-drop .drop-hint { font-size: .83rem; color: var(--muted); }
.file-drop .drop-name { font-size: .87rem; font-weight: 500; color: var(--teal); margin-top: .3rem; display:none; }
.user-choice { display: flex; gap: .75rem; flex-wrap: wrap; margin: .5rem 0; }
.user-choice label { display: flex; align-items: center; gap: .4rem; font-size: .88rem; cursor: pointer; }
.form-label { font-size: .82rem; font-weight: 500; color: var(--muted); margin-bottom: .3rem; display: block; }
.import-status { font-size: .83rem; min-height: 1.1rem; margin-top: .35rem; }
.import-status.ok { color: var(--good); }
.import-status.err { color: var(--coral); }
.manual-form { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
@media (max-width:520px) { .manual-form { grid-template-columns: 1fr; } }
.form-group { display: flex; flex-direction: column; gap: .3rem; }
.form-group input, .form-group select {
  font-family: "Rubik", sans-serif;
  font-size: .88rem;
  padding: .5rem .75rem;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--card);
  color: var(--ink);
  outline: none;
  width: 100%;
}
.form-group input:focus, .form-group select:focus { border-color: var(--teal); }
.btn {
  display: inline-flex; align-items: center; gap: .4rem;
  padding: .55rem 1.15rem;
  border-radius: 8px;
  border: none;
  font-family: "Rubik", sans-serif;
  font-size: .88rem;
  font-weight: 600;
  cursor: pointer;
  transition: opacity .15s, transform .1s;
}
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .45; cursor: default; }
.btn-primary { background: var(--teal); color: #fff; }
.btn-primary:hover:not(:disabled) { opacity: .88; }
.btn-secondary { background: var(--line); color: var(--ink); }
.btn-secondary:hover:not(:disabled) { opacity: .8; }
.modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(28,36,40,.48);
  z-index: 200;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--card);
  border-radius: var(--radius);
  padding: 1.5rem 1.4rem;
  max-width: 520px;
  width: 100%;
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
  position: relative;
}
.modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: .9rem; }
.modal-header h3 { font-size: 1.05rem; font-weight: 700; color: var(--teal); }
.modal-close { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: var(--muted); line-height: 1; padding: .1rem .3rem; }
.modal-close:hover { color: var(--ink); }
.empty { text-align: center; padding: 2.5rem 1rem; color: var(--muted); }
.empty .eicon { font-size: 2.2rem; margin-bottom: .5rem; }
.empty p { font-size: .88rem; }
.ltr, .num { direction: ltr; display: inline-block; unicode-bidi: plaintext; }
.flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: .5rem; }
.mt05 { margin-top: .5rem; }
.mt1 { margin-top: 1rem; }
.text-muted { color: var(--muted); font-size: .8rem; }
.text-good { color: var(--good); }
.text-bad { color: var(--coral); }
.fw6 { font-weight: 600; }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>דשבורד הוצאות</h1>
    <div class="sub" id="hdr-sub">טוען...</div>
  </div>
  <div class="month-nav">
    <button id="btn-prev" title="חודש קודם">&#8250;</button>
    <select id="month-sel"></select>
    <button id="btn-next" title="חודש הבא">&#8249;</button>
  </div>
</header>

<nav class="tabs" role="tablist">
  <button class="tab-btn active" data-tab="summary" role="tab">סיכום</button>
  <button class="tab-btn" data-tab="categories" role="tab">קטגוריות</button>
  <button class="tab-btn" data-tab="trends" role="tab">מגמות</button>
  <button class="tab-btn" data-tab="transactions" role="tab">עסקאות</button>
  <button class="tab-btn" data-tab="import" role="tab">ייבוא</button>
  <button class="tab-btn" data-tab="income" role="tab">הכנסות</button>
  <button class="tab-btn" data-tab="wealth" role="tab">הון</button>
</nav>
