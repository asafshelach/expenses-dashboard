<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>דשבורד הוצאות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Rubik',sans-serif;background:#f0f4f8;color:#1a1a2e;direction:rtl}
.header{background:linear-gradient(135deg,#0f6e6a,#1a9490);color:#fff;padding:20px;text-align:center}
.header h1{font-size:1.5rem;font-weight:700}
.month-bar{background:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.month-bar select{font-family:'Rubik',sans-serif;padding:8px 12px;border:2px solid #0f6e6a;border-radius:8px;font-size:1rem;color:#1a1a2e;background:#fff;cursor:pointer}
.month-bar button{background:#0f6e6a;color:#fff;border:none;padding:8px 18px;border-radius:8px;font-family:'Rubik',sans-serif;font-size:1rem;cursor:pointer}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;padding:16px}
.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.07);text-align:center}
.card .label{font-size:.75rem;color:#666;margin-bottom:4px}
.card .value{font-size:1.4rem;font-weight:700;color:#0f6e6a}
.card .sub{font-size:.8rem;color:#999;margin-top:2px}
.budget-bar-wrap{padding:0 16px 16px}
.budget-bar-wrap .title{font-size:.85rem;color:#444;margin-bottom:6px}
.budget-bar{background:#e0e0e0;border-radius:8px;height:12px;overflow:hidden}
.budget-fill{height:100%;border-radius:8px;transition:width .5s}
.budget-label{font-size:.75rem;color:#666;margin-top:4px;text-align:left}
.section{padding:0 16px 16px}
.section h2{font-size:1rem;font-weight:600;margin-bottom:10px;color:#1a1a2e}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.07)}
th{background:#0f6e6a;color:#fff;padding:10px 12px;font-size:.8rem;font-weight:600;text-align:right}
td{padding:10px 12px;font-size:.85rem;border-bottom:1px solid #f0f0f0;text-align:right}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f5fffe}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 16px}
.split-card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.07);text-align:center}
.split-card .name{font-size:.85rem;color:#666;margin-bottom:4px}
.split-card .amount{font-size:1.2rem;font-weight:700;color:#0f6e6a}
.split-card .pct{font-size:.75rem;color:#999}
.loading{text-align:center;padding:40px;color:#666}
.error{background:#fff0f0;color:#c00;padding:16px;margin:16px;border-radius:8px;text-align:center}
</style>
</head>
<body>
<div class="header">
  <div style="font-size:.85rem;opacity:.8;margin-bottom:4px">הוצאות משפחתיות</div>
  <h1 id="pageTitle">טוען...</h1>
</div>
<div class="month-bar">
  <select id="monthSelect" onchange="loadSelected()"></select>
  <button onclick="loadSelected()">רענן</button>
</div>
<div id="content"><div class="loading">טוען נתונים...</div></div>
<script>
const API = 'https://asafshe.wixsite.com/expenses-bot/_functions/getSummary';

function buildMonths(cur) {
  const sel = document.getElementById('monthSelect');
  sel.innerHTML = '';
  const now = new Date();
  for (let i = 0; i < 24; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const val = d.toISOString().slice(0,7);
    const label = d.toLocaleDateString('he-IL',{year:'numeric',month:'long'});
    const opt = document.createElement('option');
    opt.value = val; opt.textContent = label;
    if (val === cur) opt.selected = true;
    sel.appendChild(opt);
  }
}

function heMon(m) {
  const [y,mo] = m.split('-');
  return new Date(+y, +mo-1, 1).toLocaleDateString('he-IL',{year:'numeric',month:'long'});
}

function loadSelected() { loadMonth(document.getElementById('monthSelect').value); }

async function loadMonth(month) {
  document.getElementById('pageTitle').textContent = heMon(month);
  document.getElementById('content').innerHTML = '<div class="loading">טוען...</div>';
  try {
    const r = await fetch(API + '?month=' + month);
    const d = await r.json();
    render(d, month);
  } catch(e) {
    document.getElementById('content').innerHTML = '<div class="error">שגיאה בטעינת נתונים: ' + e.message + '</div>';
  }
}

function fmt(n) { return '\u20aa' + Number(n||0).toLocaleString('he-IL',{maximumFractionDigits:0}); }

function render(d, month) {
  const total = d.totalAmount || 0;
  const count = d.transactionCount || 0;
  const goal = d.monthlyGoal || 17000;
  const pct = Math.min(100, Math.round(total/goal*100));
  const fillColor = pct > 100 ? '#e53935' : pct > 85 ? '#f57c00' : '#0f6e6a';
  const cats = d.byCategory || [];
  const users = d.byUser || {};
  const asaf = users['asaf'] || users['\u05d0\u05e1\u05e3'] || 0;
  const karina = users['karina'] || users['\u05e7\u05e8\u05d9\u05e0\u05d4'] || 0;
  const asafPct = total ? Math.round(asaf/total*100) : 0;
  const karinaPct = total ? Math.round(karina/total*100) : 0;

  let html = '';

  // Cards
  html += '<div class="cards">';
  html += '<div class="card"><div class="label">\u05e1\u05d4\"\u05db</div><div class="value">' + fmt(total) + '</div><div class="sub">' + count + ' \u05ea\u05e0\u05d5\u05e2\u05d5\u05ea</div></div>';
  html += '<div class="card"><div class="label">\u05d9\u05e2\u05d3</div><div class="value">' + fmt(goal) + '</div><div class="sub">' + (total > goal ? '\u05d7\u05e8\u05d9\u05d2\u05d4 \u05e9\u05dc ' + fmt(total-goal) : '\u05e0\u05d5\u05ea\u05e8 ' + fmt(goal-total)) + '</div></div>';
  html += '</div>';

  // Budget bar
  html += '<div class="budget-bar-wrap"><div class="title">\u05e0\u05d9\u05e6\u05d5\u05dc \u05ea\u05e7\u05e6\u05d9\u05d1</div>';
  html += '<div class="budget-bar"><div class="budget-fill" style="width:' + pct + '%;background:' + fillColor + '"></div></div>';
  html += '<div class="budget-label">' + pct + '%</div></div>';

  // User split
  html += '<div class="split">';
  html += '<div class="split-card"><div class="name">\u05d0\u05e1\u05e3</div><div class="amount">' + fmt(asaf) + '</div><div class="pct">' + asafPct + '%</div></div>';
  html += '<div class="split-card"><div class="name">\u05e7\u05e8\u05d9\u05e0\u05d4</div><div class="amount">' + fmt(karina) + '</div><div class="pct">' + karinaPct + '%</div></div>';
  html += '</div>';

  // Categories table
  if (cats.length) {
    html += '<div class="section"><h2>\u05dc\u05e4\u05d9 \u05e7\u05d8\u05d2\u05d5\u05e8\u05d9\u05d4</h2>';
    html += '<table><tr><th>\u05e7\u05d8\u05d2\u05d5\u05e8\u05d9\u05d4</th><th>\u05e1\u05db\u05d5\u05dd</th><th>%</th></tr>';
    cats.sort((a,b)=>b.amount-a.amount).forEach(c=>{
      const p = total ? Math.round(c.amount/total*100) : 0;
      html += '<tr><td>' + (c.category||c.name||'-') + '</td><td>' + fmt(c.amount) + '</td><td>' + p + '%</td></tr>';
    });
    html += '</table></div>';
  }

  document.getElementById('content').innerHTML = html;
}

const m = new Date().toISOString().slice(0,7);
buildMonths(m);
loadMonth(m);
</script>
</body>
</html>
